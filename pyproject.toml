[project]
name = "addrck"
version = "0.1.0"
description = "simple SMTP email address verifier"
readme = "README.md"
authors = [
    { name = "Addison Kline", email = "addison@addisonkline.net" }
]
requires-python = ">=3.13"
dependencies = [
    "dnspython>=2.9.0",
    "validators>=0.36.0",
]

[project.scripts]
addrck = "addrck.cli:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
