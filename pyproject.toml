[project]
name = "addrck"
version = "0.1.0"
description = "simple SMTP email address verifier"
readme = "README.md"
authors = [
    { name = "Addison Kline", email = "addison@addisonkline.net" }
]
requires-python = ">=3.13"
dependencies = [
    "dnspython>=2.9.0",
    "validators>=0.36.0",
]

[project.scripts]
addrck = "addrck.cli:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["addrck"]
branch = true

[tool.coverage.report]
show_missing = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]
